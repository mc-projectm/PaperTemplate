import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.3'
}

group = 'com.projectm'
version = '1.0-SNAPSHOT'
description = 'Trophies'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "citizens"
        url = "https://maven.citizensnpcs.co/repo"
    }
    maven {
        url = 'https://nexus.scarsz.me/content/groups/public/'
        name = "discord-srv"
    }

    // Required for libby, which is a subdependency of citizens
    maven {
        url = 'https://repo.byteflux.net/repository/maven-public/'
        name = 'libby-repo'
    }
    maven { url = "https://repo.codemc.org/repository/maven-public/" }

}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.45.1'
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    compileOnly 'com.discordsrv:discordsrv:1.28.0'
    compileOnly "net.citizensnpcs:citizens-main:2.0.38-SNAPSHOT"

    compileOnly 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'
    compileOnly 'dev.jorel:commandapi-bukkit-shade-mojang-mapped:10.0.0'

    compileOnly 'io.papermc:paperlib:1.0.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    compileOnly 'com.github.stefvanschie.inventoryframework:IF:0.10.8'

}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.withType(ShadowJar).configureEach {
    relocate("dev.jorel.commandapi", "com.projectm.trophies.commandapi")
}